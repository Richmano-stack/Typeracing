version: "3.9"

services:
  # Development Database
  postgres:
    image: postgres:16
    container_name: typeracer-postgres-dev
    ports:
      - "5432:5432" # Standard port for local dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  # Test Database
  postgres_test:
    image: postgres:16
    container_name: typeracer-postgres-test
    ports:
      - "5433:5432" # Maps Host 5433 to Container 5432
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: typeracer_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_dev_data:
  postgres_test_data:
  redis_data:
